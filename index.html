<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VD Portfolio Tracker — Rishyavandhan</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0e14; --surface:#111520; --border:#1e2535; --muted:#2a3048;
    --text:#c8d0e0; --dim:#5a6480; --accent:#4fc3f7; --green:#4caf7d;
    --amber:#f0a500; --red:#e05a5a;
    --p0:#4fc3f7; --p1:#4fc3f7; --p2:#7c83ff; --p3:#ff8a65;
    --p4:#66bb6a; --p5:#ffd54f; --p7:#ce93d8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--text);
         display:flex; min-height:100vh; font-size:14px; }

  /* SIDEBAR */
  aside { width:240px; min-width:240px; background:var(--surface);
          border-right:1px solid var(--border); padding:24px 0;
          position:sticky; top:0; height:100vh; overflow-y:auto;
          display:flex; flex-direction:column; }
  .logo { padding:0 20px 20px; border-bottom:1px solid var(--border); }
  .logo h1 { font-size:13px; font-weight:600; color:var(--accent);
             letter-spacing:0.04em; line-height:1.3; }
  .logo p { font-size:11px; color:var(--dim); margin-top:4px;
            font-family:'IBM Plex Mono',monospace; }
  .total-progress { padding:16px 20px; border-bottom:1px solid var(--border); }
  .total-progress .label { font-size:11px; color:var(--dim); margin-bottom:6px;
                           display:flex; justify-content:space-between; }
  .bar-wrap { background:var(--muted); height:4px; border-radius:2px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:2px; transition:width 0.3s ease; }
  nav { padding:12px 0; flex:1; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 20px;
              cursor:pointer; border-left:3px solid transparent;
              transition:background 0.15s, border-color 0.15s; }
  .nav-item:hover { background:var(--muted); }
  .nav-item.active { background:rgba(79,195,247,0.06); border-left-color:var(--accent); }
  .nav-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .nav-label { font-size:12px; font-weight:500; flex:1; line-height:1.3; }
  .nav-count { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); }
  .nav-mini-bar { height:2px; background:var(--muted); border-radius:1px;
                  margin:2px 0 0; overflow:hidden; }
  .nav-mini-fill { height:100%; border-radius:1px; }

  /* MAIN */
  main { flex:1; padding:32px 40px; overflow-y:auto; }
  .page-header { margin-bottom:32px; }
  .page-header h2 { font-size:24px; font-weight:300; color:#e8ecf4; margin-bottom:6px; }
  .page-header p { font-size:12px; color:var(--dim); font-family:'IBM Plex Mono',monospace; }
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:36px; }
  .stat-card { background:var(--surface); border:1px solid var(--border);
               border-radius:6px; padding:14px 16px; }
  .stat-val { font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:500;
              color:#e8ecf4; line-height:1; margin-bottom:4px; }
  .stat-label { font-size:11px; color:var(--dim); }

  .pillar-header { display:flex; align-items:baseline; gap:16px; margin-bottom:8px; }
  .pillar-title { font-size:20px; font-weight:600; color:#e8ecf4; }
  .pillar-tag { font-family:'IBM Plex Mono',monospace; font-size:11px;
                padding:2px 8px; border-radius:3px; font-weight:500; }
  .pillar-desc { font-size:12px; color:var(--dim); margin-bottom:24px; line-height:1.6; }
  .pillar-progress-row { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .pillar-bar-wrap { flex:1; background:var(--muted); height:5px;
                     border-radius:3px; overflow:hidden; }
  .pillar-bar-fill { height:100%; border-radius:3px; transition:width 0.3s ease; }
  .pillar-pct { font-family:'IBM Plex Mono',monospace; font-size:11px;
                color:var(--dim); min-width:36px; text-align:right; }

  .group-label { font-size:10px; font-weight:600; letter-spacing:0.1em;
                 color:var(--dim); text-transform:uppercase; margin:20px 0 10px;
                 display:flex; align-items:center; gap:8px; }
  .group-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .project-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
                  gap:8px; margin-bottom:4px; }
  .project-card { background:var(--surface); border:1px solid var(--border);
                  border-radius:6px; padding:12px 14px; display:flex;
                  align-items:flex-start; gap:10px; cursor:pointer;
                  transition:border-color 0.15s, background 0.15s; user-select:none;
                  position:relative; }
  .project-card:hover { border-color:var(--muted); background:#141828; }
  .project-card.done { background:rgba(76,175,125,0.04); border-color:rgba(76,175,125,0.2); }
  .project-card.done .proj-title { color:var(--dim);
        text-decoration:line-through; text-decoration-color:rgba(90,100,128,0.5); }
  .proj-check { width:16px; height:16px; border:1.5px solid var(--muted);
                border-radius:3px; flex-shrink:0; margin-top:1px;
                display:flex; align-items:center; justify-content:center;
                transition:all 0.15s; }
  .project-card.done .proj-check { background:var(--green); border-color:var(--green); }
  .proj-check svg { display:none; }
  .project-card.done .proj-check svg { display:block; }
  .proj-body { flex:1; min-width:0; }
  .proj-id { font-family:'IBM Plex Mono',monospace; font-size:10px;
             color:var(--dim); margin-bottom:2px; }
  .proj-title { font-size:13px; font-weight:400; color:var(--text); line-height:1.4; }
  .proj-hint { position:absolute; top:8px; right:10px; font-size:10px;
               color:var(--dim); font-family:'IBM Plex Mono',monospace;
               opacity:0.5; }
  .project-card:hover .proj-hint { color:var(--accent); opacity:1; }

  .pillar-section { display:none; }
  .pillar-section.active { display:block; }
  .filter-row { display:flex; gap:8px; margin-bottom:28px; align-items:center; }
  .filter-btn { font-family:'IBM Plex Mono',monospace; font-size:11px;
                padding:4px 12px; border-radius:3px; border:1px solid var(--border);
                background:transparent; color:var(--dim); cursor:pointer;
                transition:all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color:var(--accent);
                color:var(--accent); background:rgba(79,195,247,0.06); }
  .filter-label { font-size:11px; color:var(--dim); margin-right:4px; }

  .dependency-note { font-size:11px; color:var(--amber);
                     background:rgba(240,165,0,0.08);
                     border:1px solid rgba(240,165,0,0.2);
                     border-radius:4px; padding:8px 12px; margin-bottom:20px;
                     font-family:'IBM Plex Mono',monospace; line-height:1.6; }

  @media (max-width:768px) {
    body { flex-direction:column; }
    aside { width:100%; height:auto; position:static; }
    main { padding:20px; }
    .stats-row { grid-template-columns:repeat(2,1fr); }
  }

  /* MODAL */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
             z-index:100; backdrop-filter:blur(2px); }
  .overlay.open { display:block; }
  .drawer { position:fixed; top:0; right:0; width:min(600px,100vw); height:100vh;
            background:#111520; border-left:1px solid var(--border); z-index:101;
            overflow-y:auto; transform:translateX(100%);
            transition:transform 0.25s ease; padding:0; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { position:sticky; top:0; background:#111520;
                 border-bottom:1px solid var(--border); padding:16px 20px;
                 display:flex; align-items:flex-start; gap:12px; z-index:1; }
  .drawer-head-text { flex:1; }
  .drawer-pid { font-family:'IBM Plex Mono',monospace; font-size:11px;
                color:var(--dim); margin-bottom:3px; }
  .drawer-title { font-size:16px; font-weight:600; color:#e8ecf4; line-height:1.3; }
  .drawer-close { background:var(--muted); border:none; color:var(--dim);
                  width:28px; height:28px; border-radius:4px; cursor:pointer;
                  font-size:16px; display:flex; align-items:center;
                  justify-content:center; flex-shrink:0; margin-top:2px; }
  .drawer-close:hover { background:var(--border); color:var(--text); }
  .drawer-body { padding:20px; }

  .section-label { font-size:10px; font-weight:600; letter-spacing:0.1em;
                   text-transform:uppercase; color:var(--accent); margin:20px 0 8px; }
  .section-label:first-child { margin-top:0; }
  .concept-text { font-size:13px; line-height:1.7; color:var(--text); }
  .why-box { background:rgba(79,195,247,0.06); border:1px solid rgba(79,195,247,0.15);
             border-radius:5px; padding:10px 14px; font-size:12px;
             line-height:1.6; color:#90d4f5; }
  .steps-list { list-style:none; counter-reset:step; }
  .steps-list li { counter-increment:step; display:flex; gap:10px;
                   margin-bottom:10px; font-size:12px; line-height:1.6; color:var(--text); }
  .steps-list li::before { content:counter(step); font-family:'IBM Plex Mono',monospace;
                   font-size:10px; color:var(--accent);
                   background:rgba(79,195,247,0.1); border-radius:3px;
                   width:20px; height:20px; display:flex; align-items:center;
                   justify-content:center; flex-shrink:0; margin-top:1px; }
  .eq-block { background:#0a0d14; border:1px solid var(--border);
              border-radius:4px; padding:8px 12px; margin-bottom:6px;
              font-family:'IBM Plex Mono',monospace; font-size:11px;
              color:#b8d4ff; line-height:1.5; }
  .deliverable-list { list-style:none; }
  .deliverable-list li { display:flex; gap:8px; margin-bottom:7px;
              font-size:12px; line-height:1.5; color:var(--text); }
  .deliverable-list li::before { content:'▸'; color:var(--green);
              flex-shrink:0; margin-top:1px; }
  .matlab-list { list-style:none; }
  .matlab-list li { font-family:'IBM Plex Mono',monospace; font-size:11px;
              color:#a0b4d0; margin-bottom:5px; background:#0a0d14;
              border-radius:3px; padding:5px 10px; line-height:1.4; }
  .done-banner { background:rgba(76,175,125,0.08);
              border:1px solid rgba(76,175,125,0.25); border-radius:5px;
              padding:8px 14px; font-size:12px; color:var(--green);
              display:flex; align-items:center; gap:8px; margin-bottom:16px; }
</style>
</head>
<body>

<aside>
  <div class="logo">
    <h1>VD Portfolio Tracker</h1>
    <p>Rishyavandhan V · 2026</p>
  </div>
  <div class="total-progress">
    <div class="label">
      <span>Overall progress</span>
      <span id="total-label">0 / 0</span>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill" id="total-bar" style="width:0%; background: var(--accent);"></div>
    </div>
  </div>
  <nav id="sidebar-nav"></nav>
</aside>

<main id="main-content">
  <div class="page-header">
    <h2>Vehicle Dynamics Portfolio</h2>
    <p>Click a pillar in the sidebar → check off projects as you complete them · click a card for the full spec</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="stat-done">0</div><div class="stat-label">Completed</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-total">0</div><div class="stat-label">Total projects</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-pillars">0</div><div class="stat-label">Pillars started</div></div>
    <div class="stat-card"><div class="stat-val" id="stat-pct">0%</div><div class="stat-label">Progress</div></div>
  </div>

  <div id="pillar-sections"></div>
</main>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-head-text">
      <div class="drawer-pid" id="drawer-pid"></div>
      <div class="drawer-title" id="drawer-title"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

<script>
/* =====================================================================
   PILLARS — original structure preserved exactly.
   Pillar 0 is the only addition (new pillar at the top).
   ===================================================================== */
const PILLARS = [
  {
    id: 'p0',
    color: 'var(--p0)',
    title: 'Pillar 0 — VD Fundamentals Mini-Projects',
    short: 'Mini-Projects',
    desc: 'Eight small self-contained MATLAB projects demonstrating core VD theory. Whiteboard-level derivations with working code and plots. Do Phase 0 before touching the lap sim.',
    dep: 'No prerequisites. Do first.',
    groups: [
      { label: '0 — Core Concepts', projects: [
        { id:'0.1', title:'Linear bicycle model' },
        { id:'0.2', title:'Handling diagram' },
        { id:'0.3', title:'GG diagram / friction ellipse' },
        { id:'0.4', title:'Longitudinal dynamics' },
        { id:'0.5', title:'Simple ABS logic' },
        { id:'0.6', title:'Simple TCS logic' },
        { id:'0.7', title:'Yaw moment control (TV concept)' },
        { id:'0.8', title:'State-space bicycle model + observer' },
      ]},
    ]
  },
  {
    id: 'p1', color: 'var(--p1)',
    title: 'Pillar 1 — Fundamentals',
    short: 'Fundamentals',
    desc: 'Pure MATLAB. Physics from first principles. No commercial tools. Execute in order: loads → tyre basics → longitudinal → lateral → ride → suspension → manoeuvres.',
    dep: null,
    groups: [
      { label: 'D — Load Transfer', projects: [
        { id:'D1', title:'Static axle loads' },
        { id:'D2', title:'Longitudinal load transfer' },
        { id:'D3', title:'Lateral load transfer' },
        { id:'D4', title:'Combined load transfer' },
        { id:'D5', title:'Load transfer effect on tyre balance' },
      ]},
      { label: 'A — Tyre Basics', projects: [
        { id:'A1', title:'Brush tyre model — lateral' },
        { id:'A2', title:'Brush tyre model — longitudinal' },
        { id:'A4', title:'Combined slip — friction ellipse' },
      ]},
      { label: 'B — Longitudinal Dynamics', projects: [
        { id:'B1', title:'Point-mass longitudinal dynamics' },
        { id:'B2', title:'Wheel dynamics and slip ratio' },
        { id:'B3', title:'Braking and wheel lockup' },
        { id:'B7', title:'Longitudinal LT effect on tyre capacity' },
      ]},
      { label: 'C — Lateral / Planar Dynamics', projects: [
        { id:'C1', title:'Linear bicycle model — derivation' },
        { id:'C2', title:'Steady-state yaw rate gain and sideslip' },
        { id:'C3', title:'Eigenvalue analysis' },
        { id:'C4', title:'Step-steer transient response' },
        { id:'C5', title:'Frequency response — Bode plot' },
        { id:'C6', title:'Nonlinear bicycle model' },
        { id:'C7', title:'Handling diagram' },
        { id:'C8', title:'GG diagram derivation' },
        { id:'C9', title:'Four-wheel planar model' },
      ]},
      { label: 'E — Ride / Vertical Dynamics', projects: [
        { id:'E1', title:'Quarter-car model — free response' },
        { id:'E2', title:'Quarter-car — frequency response' },
        { id:'E3', title:'Comfort vs. handling trade-off' },
        { id:'E4', title:'ISO 8608 road profile generation' },
        { id:'E5', title:'Half-car model — pitch dynamics' },
        { id:'E6', title:'Damper and spring sensitivity study' },
        { id:'E7', title:'Anti-roll bar effect' },
        { id:'E8', title:'Active suspension — quarter-car with force actuator' },
        { id:'E9', title:'Active suspension — Bode-based controller design' },
      ]},
      { label: 'F — Suspension Kinematics', projects: [
        { id:'F1', title:'Double wishbone geometry — 2D' },
        { id:'F2', title:'Roll centre' },
        { id:'F3', title:'Constraint-based solver' },
        { id:'F4', title:'Motion ratio' },
      ]},
      { label: 'G — Steady-State Handling & Manoeuvres', projects: [
        { id:'G1', title:'Constant radius manoeuvre' },
        { id:'G2', title:'Steer-pad simulation' },
        { id:'G3', title:'ISO lane change — open loop' },
        { id:'G4', title:'Vehicle balance sensitivity' },
      ]},
    ]
  },
  {
    id: 'p2', color: 'var(--p2)',
    title: 'Pillar 2 — LTS MATLAB',
    short: 'LTS MATLAB',
    desc: 'Lap-time simulator refactor, Python post-processing, and Simulink plant. Requires Pillar 1 tyre basics (A1, A2, A4, D1–D5) to be stable first.',
    dep: 'Requires: D1–D5, A1–A2, A4 from Pillar 1',
    groups: [
      { label: 'I — Lap-Time Simulation', projects: [
        { id:'I1', title:'Track preprocessing' },
        { id:'I2', title:'Corner speed limit' },
        { id:'I3', title:'Longitudinal limit from GG' },
        { id:'I4', title:'Forward / backward pass solver' },
        { id:'I5', title:'Lap-time sensitivity study' },
        { id:'I6', title:'Point-mass dynamic lap-time concept' },
      ]},
      { label: 'J — Python Data Pipeline', projects: [
        { id:'J1', title:'Load MATLAB result and reproduce plot' },
        { id:'J2', title:'Batch sweep automation' },
        { id:'J3', title:'KPI extraction and summary CSV' },
        { id:'J4', title:'Simulation vs. reference correlation' },
      ]},
      { label: 'S — Simulink Plant', projects: [
        { id:'S1', title:'Simulink plant — longitudinal dynamics subsystem' },
        { id:'S2', title:'Simulink plant — lateral / yaw dynamics subsystem' },
        { id:'S3', title:'Simulink tyre force block (MATLAB Function)' },
        { id:'S4', title:'Simulink aero subsystem' },
        { id:'S5', title:'Simulink powertrain subsystem' },
        { id:'S6', title:'Full plant integration and signal logging' },
        { id:'S7', title:'MATLAB vs. Simulink output comparison (MIL baseline)' },
      ]},
    ]
  },
  {
    id: 'p3', color: 'var(--p3)',
    title: 'Pillar 3 — Tyre Dynamics',
    short: 'Tyre Dynamics',
    desc: 'Deeper tyre physics. Pacejka MF5.2, combined slip, load sensitivity, coefficient fitting. Requires Pillar 1 tyre basics first.',
    dep: 'Requires: A1, A2, A4 from Pillar 1',
    groups: [
      { label: 'A — Tyre Dynamics (extended)', projects: [
        { id:'A3', title:'Pacejka MF5.2 implementation (Fy, Fx, Mz)' },
        { id:'A5', title:'Load sensitivity — normalised peak force vs. Fz' },
        { id:'A6', title:'Camber sensitivity and aligning moment' },
        { id:'A7', title:'Tyre model comparison and selection rationale' },
        { id:'A8', title:'Tyre coefficient fitting with fmincon' },
      ]},
    ]
  },
  {
    id: 'p4', color: 'var(--p4)',
    title: 'Pillar 4 — Controls & MPC',
    short: 'Controls / MPC',
    desc: 'Control theory applied to VD. MATLAB first, then Simulink closed-loop. Requires Pillar 1 bicycle model (C1–C5) and longitudinal dynamics (B1–B3).',
    dep: 'Requires: B1–B3, C1–C5 from Pillar 1 · S1–S7 from Pillar 2 (for Simulink work)',
    groups: [
      { label: 'B / C — Longitudinal & Yaw Controllers (MATLAB)', projects: [
        { id:'B4', title:'Simple ABS slip controller' },
        { id:'B5', title:'Simple TCS' },
        { id:'B6', title:'Launch control' },
        { id:'C10', title:'Torque vectoring — yaw moment control' },
        { id:'C11', title:'Closed-loop bicycle model — frequency response shaping' },
      ]},
      { label: 'H — State-Space and Observers (MATLAB)', projects: [
        { id:'H1', title:'Bicycle model in state-space form' },
        { id:'H2', title:'Luenberger observer for sideslip estimation' },
        { id:'H3', title:'Kalman filter for sideslip estimation' },
        { id:'H4', title:'ESC yaw rate controller' },
        { id:'H5', title:'PID tuning for slip controller' },
        { id:'H6', title:'Plant transfer function derivation — slip and yaw dynamics' },
        { id:'H7', title:'Root locus controller design for slip and ESC' },
        { id:'H8', title:'Bode stability margins — gain and phase margin for ESC' },
      ]},
      { label: 'S — Controllers in Simulink (closed-loop)', projects: [
        { id:'S8',  title:'ABS controller in Simulink — closed loop with plant' },
        { id:'S9',  title:'TCS controller in Simulink' },
        { id:'S10', title:'ESC yaw moment controller in Simulink' },
        { id:'S11', title:'Torque vectoring controller in Simulink' },
        { id:'S12', title:'MPC via quadprog in MATLAB Function block' },
        { id:'S13', title:'Fixed-step solver configuration and step-size study' },
      ]},
      { label: 'K — Digital Controller Design', projects: [
        { id:'K1', title:'Controller discretisation — Tustin vs ZOH comparison' },
        { id:'K2', title:'Sample rate sensitivity and aliasing study' },
        { id:'K3', title:'Z-domain analysis for discrete slip controller' },
      ]},
    ]
  },
  {
    id: 'p5', color: 'var(--p5)',
    title: 'Pillar 5 — CAN & ADAS',
    short: 'CAN / ADAS',
    desc: 'Communication protocols and ADAS fundamentals. Most can be done without paid toolboxes — DBC by hand, manual bit manipulation in MATLAB, concept documents.',
    dep: 'CAN Pack/Unpack blocks require Vehicle Network Toolbox. Core tasks are toolbox-free.',
    groups: [
      { label: 'P5 — CAN Fundamentals', projects: [
        { id:'P5_1', title:'CAN frame structure — documented with signal diagram' },
        { id:'P5_2', title:'DBC file — write by hand (5–6 signals)' },
        { id:'P5_3', title:'Manual CAN encoding / decoding in MATLAB' },
        { id:'P5_4', title:'CANape / INCA concept — A2L file, calibration parameter' },
      ]},
      { label: 'P5 — ADAS Basics', projects: [
        { id:'P5_5', title:'Sensor modalities — camera, radar, lidar limits document' },
        { id:'P5_6', title:'ACC longitudinal controller in MATLAB (headway PID)' },
        { id:'P5_7', title:'AEB and LKA control chain document' },
        { id:'P5_8', title:'VD controls vs. ADAS boundary — documented analysis' },
      ]},
    ]
  },
  {
    id: 'p7', color: 'var(--p7)',
    title: 'Pillar 7 — MIL / SIL / HIL / DiL',
    short: 'MIL/SIL/HIL/DiL',
    desc: 'Formal validation chain. Builds on Pillars 2 and 4. MIL is already implicit in S7. SIL requires fixed-step Simulink. HIL and DiL are documented concepts at basics level.',
    dep: 'Requires: S7 from Pillar 2 · S8–S13 from Pillar 4',
    groups: [
      { label: 'S — Validation Workflow', projects: [

/* =====================================================================
   STATE / STORAGE
   ===================================================================== */
function loadState() {
  try { return JSON.parse(localStorage.getItem('vd_tracker') || '{}'); }
  catch { return {}; }
}
function saveState(state) {
  localStorage.setItem('vd_tracker', JSON.stringify(state));
}
let state = loadState();

let TOTAL = 0;
PILLARS.forEach(p => p.groups.forEach(g => TOTAL += g.projects.length));
document.getElementById('stat-total').textContent = TOTAL;
document.getElementById('total-label').textContent = `0 / ${TOTAL}`;

/* =====================================================================
   SIDEBAR NAV
   ===================================================================== */
const nav = document.getElementById('sidebar-nav');
PILLARS.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'nav-item' + (i === 0 ? ' active' : '');
  item.dataset.pid = p.id;
  let ptotal = 0;
  p.groups.forEach(g => ptotal += g.projects.length);
  item.innerHTML = `
    <div class="nav-dot" style="background:${p.color}"></div>
    <div style="flex:1">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span class="nav-label">${p.short}</span>
        <span class="nav-count" data-pid="${p.id}">0/${ptotal}</span>
      </div>
      <div class="nav-mini-bar">
        <div class="nav-mini-fill" data-pid="${p.id}" style="width:0%;background:${p.color}"></div>
      </div>
    </div>`;
  item.addEventListener('click', () => showPillar(p.id));
  nav.appendChild(item);
});

/* =====================================================================
   PILLAR SECTIONS
   ===================================================================== */
const sectionsEl = document.getElementById('pillar-sections');
PILLARS.forEach((p, i) => {
  const sec = document.createElement('div');
  sec.className = 'pillar-section' + (i === 0 ? ' active' : '');
  sec.id = 'sec-' + p.id;

  let ptotal = 0;
  p.groups.forEach(g => ptotal += g.projects.length);

  const depHtml = p.dep ? `<div class="dependency-note">↳ ${p.dep}</div>` : '';

  const groupsHtml = p.groups.map(g => {
    const cards = g.projects.map(proj => {
      const done = state[proj.id] ? 'done' : '';
      const hasDetails = !!PROJECT_DETAILS[proj.id];
      const hint = hasDetails ? '<span class="proj-hint">↗ details</span>' : '';
      return `
        <div class="project-card ${done}" data-id="${proj.id}" data-pillar="${p.id}">
          <div class="proj-check">
            <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
              <path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="proj-body">
            <div class="proj-id">${proj.id}</div>
            <div class="proj-title">${proj.title}</div>
          </div>
          ${hint}
        </div>`;
    }).join('');
    return `
      <div class="group-label">${g.label}</div>
      <div class="project-grid" data-group="${g.label}">${cards}</div>`;
  }).join('');

  sec.innerHTML = `
    <div class="pillar-header">
      <div class="pillar-title">${p.title}</div>
      <div class="pillar-tag" style="background:${p.color}18;color:${p.color}">${ptotal} projects</div>
    </div>
    <div class="pillar-desc">${p.desc}</div>
    ${depHtml}
    <div class="pillar-progress-row">
      <div class="pillar-bar-wrap">
        <div class="pillar-bar-fill" data-pid="${p.id}" style="width:0%;background:${p.color}"></div>
      </div>
      <div class="pillar-pct" data-pid="${p.id}">0%</div>
    </div>
    <div class="filter-row">
      <span class="filter-label">show:</span>
      <button class="filter-btn active" data-filter="all" data-pid="${p.id}">all</button>
      <button class="filter-btn" data-filter="todo" data-pid="${p.id}">to-do</button>
      <button class="filter-btn" data-filter="done" data-pid="${p.id}">done</button>
    </div>
    ${groupsHtml}`;

  sectionsEl.appendChild(sec);
});

/* =====================================================================
   EVENT HANDLERS
   ===================================================================== */
/* Card click: checkbox toggles; elsewhere opens drawer */
sectionsEl.addEventListener('click', e => {
  const card = e.target.closest('.project-card');
  if (!card) return;
  const check = e.target.closest('.proj-check');
  const btn = e.target.closest('.filter-btn');
  if (btn) return; // filter buttons handled by their own listener

  const id = card.dataset.id;

  if (check) {
    // Toggle completion state
    state[id] = !state[id];
    card.classList.toggle('done', state[id]);
    saveState(state);
    updateStats();
    applyFilter(card.dataset.pillar);
  } else if (PROJECT_DETAILS[id]) {
    // Open the spec drawer
    openDrawer(id);
  }
});

/* Filter buttons */
sectionsEl.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const pid = btn.dataset.pid;
  sectionsEl.querySelectorAll(`.filter-btn[data-pid="${pid}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter(pid);
});

function applyFilter(pid) {
  const sec = document.getElementById('sec-' + pid);
  if (!sec) return;
  const filter = sec.querySelector('.filter-btn.active')?.dataset.filter || 'all';
  sec.querySelectorAll('.project-card').forEach(card => {
    if (filter === 'all') card.style.display = '';
    else if (filter === 'done') card.style.display = card.classList.contains('done') ? '' : 'none';
    else card.style.display = !card.classList.contains('done') ? '' : 'none';
  });
}

/* =====================================================================
   NAVIGATION / STATS
   ===================================================================== */
function showPillar(pid) {
  document.querySelectorAll('.pillar-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('sec-' + pid).classList.add('active');
  document.querySelector(`.nav-item[data-pid="${pid}"]`).classList.add('active');
  document.getElementById('main-content').scrollTop = 0;
}

function countDone() {
  let done = 0, started = 0;
  PILLARS.forEach(p => {
    let pdone = 0;
    p.groups.forEach(g => g.projects.forEach(proj => { if (state[proj.id]) { done++; pdone++; } }));
    if (pdone > 0) started++;
  });
  return { done, started };
}

function updateStats() {
  const { done, started } = countDone();
  const pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-pillars').textContent = started;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('total-label').textContent = `${done} / ${TOTAL}`;
  document.getElementById('total-bar').style.width = pct + '%';
  PILLARS.forEach(p => {
    let pdone = 0, ptotal = 0;
    p.groups.forEach(g => g.projects.forEach(proj => {
      ptotal++;
      if (state[proj.id]) pdone++;
    }));
    const el = document.querySelector(`.nav-mini-fill[data-pid="${p.id}"]`);
    const cnt = document.querySelector(`.nav-count[data-pid="${p.id}"]`);
    if (el) el.style.width = ptotal ? (pdone/ptotal*100)+'%' : '0%';
    if (cnt) cnt.textContent = `${pdone}/${ptotal}`;
    const pbar = document.querySelector(`.pillar-bar-fill[data-pid="${p.id}"]`);
    const ppct = document.querySelector(`.pillar-pct[data-pid="${p.id}"]`);
    if (pbar) pbar.style.width = ptotal ? (pdone/ptotal*100)+'%' : '0%';
    if (ppct) ppct.textContent = ptotal ? Math.round(pdone/ptotal*100)+'%' : '0%';
  });
}

/* =====================================================================
   DRAWER
   ===================================================================== */
function openDrawer(projId) {
  const d = PROJECT_DETAILS[projId];
  if (!d) return;

  const cardEl = document.querySelector(`.project-card[data-id="${projId}"]`);
  const pid = cardEl?.querySelector('.proj-id')?.textContent || projId;
  const title = cardEl?.querySelector('.proj-title')?.textContent || '';
  const isDone = state[projId];

  document.getElementById('drawer-pid').textContent = pid;
  document.getElementById('drawer-title').textContent = title;

  let html = '';
  if (isDone) {
    html += `<div class="done-banner">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <path d="M2 7l3.5 3.5 6.5-6.5" stroke="currentColor" stroke-width="1.5"
              fill="none" stroke-linecap="round"/>
      </svg>Completed</div>`;
  }

  html += `<div class="section-label">Concept</div>
           <p class="concept-text">${escHtml(d.concept)}</p>`;
  html += `<div class="section-label">Why it matters</div>
           <div class="why-box">${escHtml(d.why)}</div>`;

  if (d.steps && d.steps.length) {
    html += `<div class="section-label">Steps</div><ol class="steps-list">`;
    d.steps.forEach(s => html += `<li>${escHtml(s)}</li>`);
    html += `</ol>`;
  }
  if (d.equations && d.equations.length) {
    html += `<div class="section-label">Key Equations</div>`;
    d.equations.forEach(eq => html += `<div class="eq-block">${escHtml(eq)}</div>`);
  }
  if (d.deliverables && d.deliverables.length) {
    html += `<div class="section-label">Deliverables</div><ul class="deliverable-list">`;
    d.deliverables.forEach(dv => html += `<li>${escHtml(dv)}</li>`);
    html += `</ul>`;
  }
  if (d.matlab && d.matlab.length) {
    html += `<div class="section-label">MATLAB Hints</div><ul class="matlab-list">`;
    d.matlab.forEach(m => html += `<li>${escHtml(m)}</li>`);
    html += `</ul>`;
  }

  document.getElementById('drawer-body').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').scrollTop = 0;
}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function escHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('overlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* =====================================================================
   INIT
   ===================================================================== */
updateStats();
</script>
</body>
</html>
